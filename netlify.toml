[build]
  base      = "apps/web"
  command   = "npm install && npx vite build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Valentina chat — serverless function
[[redirects]]
  from   = "/api/chat/message"
  to     = "/.netlify/functions/chat-message"
  status = 200
  force  = true

# SPA routing: serve index.html for all client-side routes
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[context.production.environment]
  VITE_API_URL = "https://api.esenzzia.com/api"

[context.deploy-preview.environment]
  VITE_API_URL = "https://api-staging.esenzzia.com/api"
